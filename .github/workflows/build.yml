# This is a basic workflow to help you get started with Actions

name: Master.Build

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
    push:
        branches: [master]
    workflow_dispatch:
    # pull_request:
    #   branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: 'pnpm'

            - name: Cache pnpm dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.pnpm-store
                      node_modules
                  key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-

            - name: Cache Next.js build
              uses: actions/cache@v4
              with:
                  path: |
                      .next/cache
                  key: ${{ runner.os }}-nextjs-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-

            - name: Install dependencies
              run: pnpm install

            - name: Type checking
              run: pnpm run type-check

            - name: Build application
              run: pnpm run build
              env:
                  PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

            - name: Copy public and static files
              run: |
                  cp -r public .next/standalone/
                  cp -r .next/static .next/standalone/.next/

            - uses: actions/upload-artifact@v4
              with:
                  name: next-standalone
                  path: .next/standalone
                  include-hidden-files: true

    upload_artifacts:
        name: upload/artifacts
        needs: [build]
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  name: next-standalone
                  path: .next/standalone

            - uses: montudor/action-zip@v1
              with:
                  args: zip -qq -r ../../next-standalone.zip .
                  working-directory: .next/standalone

            - run: |
                  mkdir package
                  mv next-standalone.zip package/next-standalone.zip

            - name: upload artifact to stating
              uses: SamKirkland/FTP-Deploy-Action@4.0.0
              with:
                  server: ${{ secrets.ftp_server }}
                  username: ${{ secrets.ftp_username }}
                  password: ${{ secrets.ftp_password }}
                  local-dir: ./package/
                  server-dir: domains/artifacts/
