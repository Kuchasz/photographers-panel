# This is a basic workflow to help you get started with Actions

name: Master.Build

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
    push:
        branches: [master]
    workflow_dispatch:
    # pull_request:
    #   branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    build_utils:
        name: Build Utils
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Build utils
              run: |
                  cd ./packages/utils
                  pnpm run build

            - uses: actions/upload-artifact@v4
              with:
                  name: dist.utils
                  path: packages/utils/dist

    type-check:
        name: Type Check
        needs: [build_utils]
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - uses: actions/download-artifact@v4
              with:
                  name: dist.utils
                  path: ./packages/utils/dist

            - name: Type checking
              run: pnpm run type-check

    lint:
        name: Lint
        needs: [build_utils]
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - uses: actions/download-artifact@v4
              with:
                  name: dist.utils
                  path: ./packages/utils/dist

            - name: Lint
              run: pnpm run lint

    test:
        name: Test
        needs: [build_utils]
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - uses: actions/download-artifact@v4
              with:
                  name: dist.utils
                  path: ./packages/utils/dist

            - name: Run tests
              run: pnpm run test

    build_web:
        name: Build Web
        needs: [build_utils, type-check, lint, test]
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - uses: actions/download-artifact@v4
              with:
                  name: dist.utils
                  path: ./packages/utils/dist

            - name: Build web
              run: |
                  cd ./packages/web
                  pnpm run build

            - uses: actions/upload-artifact@v4
              with:
                  name: dist.web
                  path: packages/web/dist

